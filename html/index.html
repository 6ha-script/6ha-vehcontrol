<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6ha Vehicle Control</title>
    
    <!-- External Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ════════════════════════════════════════════════════════════ -->
    <!--                    MAIN CONTAINER                            -->
    <!-- ════════════════════════════════════════════════════════════ -->
    <div id="vehcontrol-container" class="hidden">
        
        <!-- لوحة المركبة -->
        <div class="vehicle-plate" id="vehicle-plate">
            85XOS127
        </div>
        
        <!-- ════════════════════════════════════════════════════════ -->
        <!--                    CONTROL PANEL                         -->
        <!-- ════════════════════════════════════════════════════════ -->
        <div class="control-panel-new">
            
            <!-- الصف الأول: المحرك واللوحة -->
            <div class="control-row-new top-row">
                <button class="control-btn-new large-btn" data-action="engine" title="تشغيل/إيقاف المحرك">
                    <img src="images/ignition.png" alt="محرك">
                </button>
                <button class="control-btn-new large-btn" data-action="plate" title="لوحة المركبة">
                    <img src="images/plate.png" alt="لوحة">
                </button>
            </div>
            
            <!-- الصف الثاني: الأبواب والنوافذ والمقاعد الأمامية -->
            <div class="control-row-new">
                <!-- الباب الأمامي الأيمن -->
                <button class="control-btn-new" data-action="door" data-index="1" title="الباب الأمامي الأيمن">
                    <img src="images/doorFrontRight.png" alt="باب أمامي أيمن">
                </button>
                
                <!-- الباب الأمامي الأيسر -->
                <button class="control-btn-new" data-action="door" data-index="0" title="الباب الأمامي الأيسر">
                    <img src="images/doorFrontLeft.png" alt="باب أمامي أيسر">
                </button>
                
                <!-- المقعد الأمامي -->
                <button class="control-btn-new seat-btn" data-action="seat" data-index="0" title="المقعد الأمامي">
                    <img src="images/seatFrontLeft.png" alt="مقعد أمامي">
                </button>
                
                <!-- مقعد السائق -->
                <button class="control-btn-new seat-btn" data-action="seat" data-index="-1" title="مقعد السائق">
                    <img src="images/seatFrontLeft.png" alt="مقعد السائق">
                </button>
                
                <!-- النافذة الأمامية اليمنى -->
                <button class="control-btn-new" data-action="window" data-index="1" title="النافذة الأمامية اليمنى">
                    <img src="images/windowFrontRight.png" alt="نافذة أمامية يمنى">
                </button>
                
                <!-- النافذة الأمامية اليسرى -->
                <button class="control-btn-new" data-action="window" data-index="0" title="النافذة الأمامية اليسرى">
                    <img src="images/windowFrontLeft.png" alt="نافذة أمامية يسرى">
                </button>
            </div>
            
            <!-- الصف الثالث: الأبواب والنوافذ والمقاعد الخلفية -->
            <div class="control-row-new">
                <!-- الباب الخلفي الأيمن -->
                <button class="control-btn-new" data-action="door" data-index="3" title="الباب الخلفي الأيمن">
                    <img src="images/doorRearRight.png" alt="باب خلفي أيمن">
                </button>
                
                <!-- الباب الخلفي الأيسر -->
                <button class="control-btn-new" data-action="door" data-index="2" title="الباب الخلفي الأيسر">
                    <img src="images/doorRearLeft.png" alt="باب خلفي أيسر">
                </button>
                
                <!-- المقعد الخلفي الأيمن -->
                <button class="control-btn-new seat-btn" data-action="seat" data-index="2" title="المقعد الخلفي الأيمن">
                    <img src="images/seatFrontLeft.png" alt="مقعد خلفي أيمن">
                </button>
                
                <!-- المقعد الخلفي الأيسر -->
                <button class="control-btn-new seat-btn" data-action="seat" data-index="1" title="المقعد الخلفي الأيسر">
                    <img src="images/seatFrontLeft.png" alt="مقعد خلفي أيسر">
                </button>
                
                <!-- النافذة الخلفية اليمنى -->
                <button class="control-btn-new" data-action="window" data-index="3" title="النافذة الخلفية اليمنى">
                    <img src="images/windowRearRight.png" alt="نافذة خلفية يمنى">
                </button>
                
                <!-- النافذة الخلفية اليسرى -->
                <button class="control-btn-new" data-action="window" data-index="2" title="النافذة الخلفية اليسرى">
                    <img src="images/windowRearLeft.png" alt="نافذة خلفية يسرى">
                </button>
            </div>
            
            <!-- الصف الرابع: غطاء المحرك والصندوق والإضاءة والإشارات -->
            <div class="control-row-new bottom-row">
                <!-- غطاء المحرك -->
                <button class="control-btn-new" data-action="bonnet" title="غطاء المحرك">
                    <img src="images/frontHood.png" alt="غطاء المحرك">
                </button>
                
                <!-- الصندوق الخلفي -->
                <button class="control-btn-new" data-action="trunk" title="الصندوق الخلفي">
                    <img src="images/rearHood.png" alt="الصندوق الخلفي">
                </button>
                
                <!-- الإضاءة الداخلية -->
                <button class="control-btn-new" data-action="interiorLight" title="الإضاءة الداخلية">
                    <img src="images/interiorLight.png" alt="إضاءة داخلية">
                </button>
                
                <!-- إشارة يسار -->
                <button class="control-btn-new signal-btn" data-action="signal" data-type="left" title="إشارة يسار">
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
                
                <!-- إشارة طوارئ -->
                <button class="control-btn-new signal-btn" data-action="signal" data-type="hazard" title="إشارة طوارئ">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </button>
                
                <!-- إشارة يمين -->
                <button class="control-btn-new signal-btn" data-action="signal" data-type="right" title="إشارة يمين">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
            </div>
            
        </div>
    </div>
    
    <!-- JavaScript -->
    <script src="script.js"></script>
</body>
</html>
